<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<title>King &amp; Pawn</title>
	<link rel="stylesheet" href="/style.css">
	<script src="/app.js" defer></script>
</head>
<body>
	<header class="top">
		<button class="brand" id="home" type="button">♔ King &amp; Pawn</button>
		<span class="progress" id="progress"></span>
	</header>
	<main id="main" aria-live="polite"></main>
	<footer class="bottom" id="footer" hidden>
		<button type="button" class="quiet" id="challenge">I think you're wrong</button>
		<button type="button" class="quiet" id="broken">This isn't working right</button>
	</footer>
	<dialog id="report">
		<form method="dialog" id="report-form">
			<h2 id="report-title">What's wrong?</h2>
			<div class="report-kinds" id="report-kinds"></div>
			<label for="report-note">Anything else? (optional)</label>
			<textarea id="report-note" rows="3"></textarea>
			<div class="row">
				<button value="cancel" type="submit" class="quiet">Cancel</button>
				<button value="send" type="submit" id="report-send">Send</button>
			</div>
		</form>
	</dialog>
</body>
</html>
